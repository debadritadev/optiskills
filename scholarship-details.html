<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Scholarship Details – OptiSkill</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Supabase JS SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <style>
    body { font-family: 'Segoe UI', sans-serif; }
    .gradient-bg { background: linear-gradient(135deg, #1e3a5f 0%, #2563eb 50%, #7c3aed 100%); }
    .sidebar-item { transition: background 0.15s; }
    .sidebar-item:hover { background: rgba(255,255,255,0.15); }
    .sidebar-item.active { background: rgba(255,255,255,0.2); }
    .animate-fade { animation: fadeIn 0.3s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col">

  <nav class="gradient-bg text-white px-4 py-3 flex items-center justify-between sticky top-0 z-40 shadow-lg">
    <div class="flex items-center gap-3">
      <button onclick="toggleSidebar()" class="lg:hidden text-white"><i class="fas fa-bars text-xl"></i></button>
      <a href="index.html" class="flex items-center gap-2">
        <img src="logo.jpg" alt="OptiSkills" class="h-9 w-auto object-contain rounded-md bg-white p-0.5 shadow-sm" />
      </a>
    </div>
    <div class="flex items-center gap-3">
      <div id="user-avatar" class="w-9 h-9 bg-yellow-400 text-gray-900 font-bold rounded-full flex items-center justify-center cursor-pointer text-sm">A</div>
    </div>
  </nav>

  <div class="flex flex-1">
    <aside id="sidebar" class="gradient-bg text-white w-64 min-h-screen p-4 flex flex-col gap-1 fixed lg:static z-30 top-14 left-0 transform -translate-x-full lg:translate-x-0 transition-transform duration-300">
      <div class="bg-white/10 rounded-xl p-3 mb-4 text-center">
        <div id="sb-avatar" class="w-14 h-14 bg-yellow-400 text-gray-900 font-bold rounded-full flex items-center justify-center mx-auto text-xl mb-2">A</div>
        <p class="font-semibold text-sm" id="sb-name">Arjun Sharma</p>
        <p class="text-white/60 text-xs" id="sb-email">student@optiskill.com</p>
      </div>
      
      <a href="dashboard.html" class="sidebar-item flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium"><i class="fas fa-home w-5 text-center"></i> Dashboard</a>
      <a href="internships.html" class="sidebar-item flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium"><i class="fas fa-briefcase w-5 text-center"></i> Internships</a>
      <a href="scholarships.html" class="sidebar-item active flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium"><i class="fas fa-medal w-5 text-center"></i> Scholarships</a>
      <a href="placements.html" class="sidebar-item flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium"><i class="fas fa-user-tie w-5 text-center"></i> Jobs</a>
      <a href="skill-assessment.html" class="sidebar-item flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium"><i class="fas fa-brain w-5 text-center"></i> Skill Assessment</a>
      <a href="ats-checker.html" class="sidebar-item flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium"><i class="fas fa-file-alt w-5 text-center"></i> ATS CV Checker</a>
      <a href="roadmap.html" class="sidebar-item flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium"><i class="fas fa-route w-5 text-center"></i> Career Roadmap</a>
      <a href="profile.html" class="sidebar-item flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium"><i class="fas fa-user w-5 text-center"></i> My Profile</a>

      <div class="mt-auto pt-4 border-t border-white/20">
        <button onclick="logout()" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium sidebar-item text-red-300"><i class="fas fa-sign-out-alt w-5 text-center"></i> Logout</button>
      </div>
    </aside>

    <main class="flex-1 p-4 md:p-8 overflow-auto">
      <div class="max-w-4xl mx-auto">
        <div class="mb-6 flex items-center justify-between">
          <a href="scholarships.html" class="inline-flex items-center gap-2 text-sm font-semibold text-gray-600 hover:text-purple-600 bg-white px-4 py-2 rounded-xl shadow-sm border border-gray-100 transition">
            <i class="fas fa-arrow-left"></i> Back to Scholarships
          </a>
          <span id="header-status-badge"></span>
        </div>

        <div id="details-container" class="bg-white rounded-3xl shadow-sm border border-gray-100 p-6 md:p-8 animate-fade">
          <div class="text-center py-12 text-gray-400">Loading scholarship details...</div>
        </div>
      </div>
    </main>
  </div>

  <script src="data.js"></script>
  <script>
    // Supabase auth check (async)
    let _profile = null;
    (async () => {
      _profile = await requireAuth('student');
      if (!_profile) return;
      const fn = (_profile.name || 'Student').split(' ')[0];
      const el = document.getElementById('user-avatar');
      if (el) el.textContent = fn[0].toUpperCase();
      const sbAv = document.getElementById('sb-avatar');
      if (sbAv) sbAv.textContent = fn[0].toUpperCase();
      const sbN = document.getElementById('sb-name');
      if (sbN) sbN.textContent = _profile.name || 'Student';
    })();

    const params = new URLSearchParams(window.location.search);
    const scholarshipId = parseInt(params.get('id'), 10);
    const item = SCHOLARSHIPS.find(s => s.id === scholarshipId) || SCHOLARSHIPS[0];

    function renderDetails() {
      if (!item) {
        document.getElementById('details-container').innerHTML = `
          <div class="text-center py-12">
            <div class="text-5xl mb-3">??</div>
            <h2 class="text-xl font-bold text-gray-700">Scholarship Not Found</h2>
            <a href="scholarships.html" class="mt-4 inline-block text-purple-600 font-semibold underline">Return to Scholarships</a>
          </div>`;
        return;
      }

      const c = COLOR_MAP[item.color] || COLOR_MAP.purple;
      const applied = isApplied(item.id, 'scholarship');

      document.getElementById('header-status-badge').innerHTML = applied 
        ? '<span class="bg-green-100 text-green-700 text-xs px-3 py-1.5 rounded-full font-semibold">? Already Applied</span>'
        : '<span class="bg-purple-100 text-purple-700 text-xs px-3 py-1.5 rounded-full font-semibold">Applications Open</span>';

      document.getElementById('details-container').innerHTML = `
        <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 pb-6 border-b border-gray-100 mb-6">
          <div class="flex items-center gap-4">
            <div class="w-16 h-16 ${c.bg} ${c.text} font-bold rounded-2xl flex items-center justify-center text-xl shadow-sm">
              ${item.logo}
            </div>
            <div>
              <div class="flex items-center gap-2">
                <h1 class="text-2xl font-bold text-gray-900">${item.title}</h1>
                <span class="${c.badge} text-xs font-semibold px-2.5 py-0.5 rounded-full">${item.category}</span>
              </div>
              <p class="text-gray-500 font-medium text-sm mt-0.5">${item.org} • <span class="text-gray-400">${item.domain}</span></p>
            </div>
          </div>
          <div>
            <button id="apply-btn" onclick="applyScholarship(${item.id})" class="${applied ? 'bg-green-100 text-green-700 cursor-default' : c.btn + ' text-white hover:shadow-lg'} px-6 py-3 rounded-xl font-bold text-sm transition">
              ${applied ? '? Application Submitted' : 'Apply For Scholarship'}
            </button>
          </div>
        </div>

        <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
          <div class="bg-gray-50 rounded-2xl p-4 border border-gray-100">
            <p class="text-gray-400 text-xs mb-1 flex items-center gap-1"><i class="fas fa-rupee-sign text-gray-400"></i> Award Amount</p>
            <p class="font-bold text-gray-800 text-base">${item.amount}</p>
          </div>
          <div class="bg-gray-50 rounded-2xl p-4 border border-gray-100">
            <p class="text-gray-400 text-xs mb-1 flex items-center gap-1"><i class="fas fa-tag text-gray-400"></i> Category</p>
            <p class="font-bold text-gray-800 text-base">${item.category}</p>
          </div>
          <div class="bg-gray-50 rounded-2xl p-4 border border-gray-100">
            <p class="text-gray-400 text-xs mb-1 flex items-center gap-1"><i class="fas fa-graduation-cap text-gray-400"></i> Stream</p>
            <p class="font-bold text-gray-800 text-base">${item.domain}</p>
          </div>
          <div class="bg-gray-50 rounded-2xl p-4 border border-gray-100">
            <p class="text-gray-400 text-xs mb-1 flex items-center gap-1"><i class="fas fa-calendar-alt text-gray-400"></i> Deadline</p>
            <p class="font-bold text-gray-800 text-base">${item.deadline}</p>
          </div>
        </div>

        <div class="mb-8">
          <h2 class="text-lg font-bold text-gray-800 mb-3 flex items-center gap-2">
            <i class="fas fa-user-check text-purple-500 text-sm"></i> Eligibility Criteria
          </h2>
          <div class="bg-purple-50/50 p-5 rounded-2xl border border-purple-100 text-gray-700 text-sm leading-relaxed flex items-start gap-3">
            <i class="fas fa-check text-purple-600 mt-1"></i>
            <div>${item.eligibility}</div>
          </div>
        </div>

        <div class="mb-8">
          <h2 class="text-lg font-bold text-gray-800 mb-3 flex items-center gap-2">
            <i class="fas fa-info-circle text-blue-500 text-sm"></i> Description & Benefits
          </h2>
          <p class="text-gray-600 leading-relaxed text-sm bg-gray-50 p-5 rounded-2xl border border-gray-100">
            ${item.desc}
          </p>
        </div>

        <div class="flex items-center justify-between pt-6 border-t border-gray-100">
          <a href="scholarships.html" class="text-gray-500 hover:text-gray-800 text-sm font-semibold flex items-center gap-2">
            <i class="fas fa-arrow-left"></i> Back to all scholarships
          </a>
          <button onclick="applyScholarship(${item.id})" class="${applied ? 'bg-green-100 text-green-700' : c.btn + ' text-white'} px-6 py-2.5 rounded-xl font-bold text-sm transition">
            ${applied ? '? Applied' : 'Apply Now'}
          </button>
        </div>`;
    }

    function applyScholarship(id) {
      applyTo(id, 'scholarship');
      showToast('Scholarship application submitted! ??');
      renderDetails();
    }

    function showToast(msg) {
      const t = document.createElement('div');
      t.className = 'fixed bottom-6 right-6 bg-green-600 text-white px-5 py-3 rounded-xl shadow-lg text-sm font-semibold z-50 animate-fade';
      t.textContent = msg;
      document.body.appendChild(t);
      setTimeout(() => t.remove(), 3000);
    }

    function toggleSidebar() {
      document.getElementById('sidebar').classList.toggle('-translate-x-full');
    }

    renderDetails();
  </script>
</body>
</html>
